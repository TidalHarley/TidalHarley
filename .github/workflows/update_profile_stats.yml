name: Update profile stats

on:
  schedule:
    - cron: "23 5 * * *"  
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=TidalHarley&rank_icon=percentile&show=prs_merged,prs_merged_percentage,issues_commented&show_icons=true&theme=github_dark"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: false

      - name: Generate top-langs card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=TidalHarley&layout=donut&langs_count=7&theme=github_dark"
          path: profile/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: false

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg 2>/dev/null || true
          git commit -m "Update profile statistics" || exit 0
          git push
